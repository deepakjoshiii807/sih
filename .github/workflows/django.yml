name: Django backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/django.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/django.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillbridge
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: skillbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillbridge -d skillbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://skillbridge:skillbridge@localhost:5432/skillbridge
      SECRET_KEY: ci-only-secret-key-please-change
      DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: No pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Seed demo data
        run: python manage.py seed_demo

      - name: API tests
        run: python manage.py test apps.api
